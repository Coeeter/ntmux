<svg xmlns="http://www.w3.org/2000/svg" width="657" height="460" viewBox="0 0 657 460" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
<rect width="657" height="460" rx="10" fill="#0d1117"/>
<rect width="657" height="38" rx="10" fill="#161b22"/>
<rect y="28" width="657" height="10" fill="#161b22"/>
<circle cx="20" cy="19" r="6" fill="#ff5f57"/>
<circle cx="40" cy="19" r="6" fill="#febc2e"/>
<circle cx="60" cy="19" r="6" fill="#28c840"/>
<text x="82" y="24" fill="#8b949e">ntmux</text>
<text x="22" y="58" fill="#7ee787" xml:space="preserve">$ ntmux help          # inside a project with ntmux.json</text>
<text x="22" y="98" fill="#c9d1d9" xml:space="preserve">Yet another tmux wrapper</text>
<text x="22" y="138" fill="#79c0ff" xml:space="preserve">Usage:</text>
<text x="22" y="158" fill="#c9d1d9" xml:space="preserve">  ntmux [flags]</text>
<text x="22" y="178" fill="#c9d1d9" xml:space="preserve">  ntmux [command]</text>
<text x="22" y="218" fill="#79c0ff" xml:space="preserve">Available Commands:</text>
<text x="22" y="238" fill="#c9d1d9" xml:space="preserve">  apply        Apply a tmux session template</text>
<text x="22" y="258" fill="#c9d1d9" xml:space="preserve">  completion   Generate the autocompletion script for the specified shell</text>
<text x="22" y="278" fill="#c9d1d9" xml:space="preserve">  help         Help about any command</text>
<text x="22" y="298" fill="#c9d1d9" xml:space="preserve">  new-template Create a new ntmux template file</text>
<text x="22" y="318" fill="#c9d1d9" xml:space="preserve">  pick         Interactively pick and attach to a tmux session using fzf</text>
<text x="22" y="338" fill="#c9d1d9" xml:space="preserve">  stop         Stop a tmux session template</text>
<text x="22" y="378" fill="#79c0ff" xml:space="preserve">Flags:</text>
<text x="22" y="398" fill="#8b949e" xml:space="preserve">  -h, --help   help for ntmux</text>
<text x="22" y="438" fill="#c9d1d9" xml:space="preserve">Use &quot;ntmux [command] --help&quot; for more information about a command.</text>
</svg>